name: daily-sync

on:
  schedule:
    # 每天 09:00 北京时间（GitHub cron 为 UTC：9:00+8 = 1:00 UTC）
    - cron: '0 1 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}${{ secrets.TG_BOT_TOKEN_1 }}${{ secrets.TG_BOT_TOKEN_2 }}${{ secrets.TG_BOT_TOKEN_3 }}${{ secrets.TG_BOT_TOKEN_4 }}${{ secrets.TG_BOT_TOKEN_5 }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore ledger cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/ledger
          key: melody-ledger-${{ github.run_id }}
          restore-keys: |
            melody-ledger-

      - name: Restore config from secret
        run: |
          echo "${{ secrets.SETTING_JSON_B64 }}" | base64 -d > config/setting.json
          test -s config/setting.json || { echo "::error::SETTING_JSON_B64 secret 缺失或无效"; exit 1; }

      # TEMP：线上配置指纹（与本地文件比对后决定是否可由 agent 直接覆盖 secret）
      - name: Debug config fingerprint (TEMP)
        run: |
          sha256sum config/setting.json
          python3 - <<'PY'
          import json
          d = json.load(open('config/setting.json'))
          a = d['accounts'][0]
          print('top_keys:', sorted(k for k in d if k != 'accounts'))
          print('acc_keys:', sorted(a.keys()))
          print('MUSIC_U:', a.get('Cookie_MUSIC_U', '')[:12], 'len', len(a.get('Cookie_MUSIC_U', '')))
          print('csrf:', a.get('Cookie___csrf', '')[:8], 'len', len(a.get('Cookie___csrf', '')))
          print('weights:', a.get('score_weights'))
          print('pool:', len(a.get('comment_pool', [])), 'extra_limit:', a.get('extra_task_limit'), 'comment:', a.get('enable_comment'))
          print('jitter:', a.get('jitter'), 'wait:', a.get('wait_time_min'), a.get('wait_time_max'), 'name:', a.get('name'))
          PY

      - name: Run daily tasks
        run: |
          rm -f data/logs/*$(date +%F).log
          export TG_BOT_TOKEN='${{ secrets.TG_BOT_TOKEN }}${{ secrets.TG_BOT_TOKEN_1 }}${{ secrets.TG_BOT_TOKEN_2 }}${{ secrets.TG_BOT_TOKEN_3 }}${{ secrets.TG_BOT_TOKEN_4 }}${{ secrets.TG_BOT_TOKEN_5 }}'
          export TG_CHAT_ID='${{ secrets.TG_CHAT_ID }}'
          python main.py

      - name: Save ledger cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: data/ledger
          key: melody-ledger-${{ github.run_id }}

      - name: Fail if cookie expired
        if: always()
        run: |
          if grep -qE "Cookie无效|Cookie失效|验证失败" data/logs/*$(date +%F).log 2>/dev/null; then
            echo "::error::检测到 Cookie 已失效！请在本地更新 config/setting.json 后重新上传 SETTING_JSON_B64 secret"
            exit 1
          fi

      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        run: |
          TG_BOT_TOKEN='${{ secrets.TG_BOT_TOKEN }}${{ secrets.TG_BOT_TOKEN_1 }}${{ secrets.TG_BOT_TOKEN_2 }}${{ secrets.TG_BOT_TOKEN_3 }}${{ secrets.TG_BOT_TOKEN_4 }}${{ secrets.TG_BOT_TOKEN_5 }}'
          TG_CHAT_ID='${{ secrets.TG_CHAT_ID }}'
          if grep -qE "Cookie无效|Cookie失效|验证失败" data/logs/*$(date +%F).log 2>/dev/null; then
            echo "Cookie 失效已在 python 层通知过，跳过重复通知"
            exit 0
          fi
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -fsS -m 20 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=melody-voter daily-sync 运行失败，详见 Actions 日志" \
              || echo "::warning::TG 失败通知发送失败（网络或凭据问题）"
          fi
