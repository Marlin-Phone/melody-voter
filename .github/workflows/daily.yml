name: daily-sync

on:
  schedule:
    # 每天 09:00 北京时间（GitHub cron 为 UTC：9:00+8 = 1:00 UTC）
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      # TEMP（2026-11-13 一次性）：补注 11-11 漏记账本；用完即删
      once:
        description: "backfill-11-11（临时，填 yes 仅跑一次）"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 可选：TG 通知（配置后启用；不配置则全部通知通道 no-op）
      # bot token 支持两种存法：单一 TG_BOT_TOKEN（标准）或拆段 TG_BOT_TOKEN_1..5
      # （部分环境 secret 有明文长度上限），未配置的那半表达式展开为空串
      # 另可在 setting.json 配 tg_bot_token/tg_chat_id 全局字段（代码侧 env 优先、config 兜底）
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}${{ secrets.TG_BOT_TOKEN_1 }}${{ secrets.TG_BOT_TOKEN_2 }}${{ secrets.TG_BOT_TOKEN_3 }}${{ secrets.TG_BOT_TOKEN_4 }}${{ secrets.TG_BOT_TOKEN_5 }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 结算期账本跨 run 持久化（每次 run 的 workspace 是全新的，
      # 不缓存的话每期累计只算当次；key 带 run_id 保证 save 必为新 key，
      # restore-keys 前缀回退到最近一次 save）
      - name: Restore ledger cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/ledger
          key: melody-ledger-${{ github.run_id }}
          restore-keys: |
            melody-ledger-

      - name: Restore config from secret
        run: |
          echo "${{ secrets.SETTING_JSON_B64 }}" | base64 -d > config/setting.json
          test -s config/setting.json || { echo "::error::SETTING_JSON_B64 secret 缺失或无效"; exit 1; }

      # TEMP（2026-11-13 一次性）：11-11 曾有一次成功的 schedule run（42980890661，20 首）
      # 当时未注入账本，导致本期少记 20 首（App 实际 115 分 = 5 天×23）。
      # 仅当手动 dispatch 且 inputs.once=yes 时执行；跑完本步骤与 once input 须立即删除。
      - name: "TEMP: backfill 11-11 ledger (20 首)"
        if: ${{ inputs.once == 'yes' }}
        run: |
          mkdir -p data/ledger
          echo '{"ts":"2026-11-11T00:00:00","done":20,"failed":0,"note":"backfill: Actions run 42980890661 (11-11 07:37Z)"}' >> data/ledger/main.jsonl
          echo '--- ledger now:'
          cat data/ledger/main.jsonl

      - name: Run daily tasks
        run: |
          # 清掉当天旧日志（含此前失败的 Cookie 失效记录），确保检测只针对本次运行
          # 否则同一天先失败、更新 cookie 后再跑一次会被历史 ERROR 误杀
          rm -f data/logs/*$(date +%F).log
          # TG 通知凭据：step 内联表达式再 export 一遍（部分环境 job 级 env 不展开 secrets；
          # python 侧还有 setting.json 的 tg_bot_token/tg_chat_id 字段兜底）
          export TG_BOT_TOKEN='${{ secrets.TG_BOT_TOKEN }}${{ secrets.TG_BOT_TOKEN_1 }}${{ secrets.TG_BOT_TOKEN_2 }}${{ secrets.TG_BOT_TOKEN_3 }}${{ secrets.TG_BOT_TOKEN_4 }}${{ secrets.TG_BOT_TOKEN_5 }}'
          export TG_CHAT_ID='${{ secrets.TG_CHAT_ID }}'
          python main.py

      - name: Save ledger cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: data/ledger
          key: melody-ledger-${{ github.run_id }}

      # Cookie 失效检测：任一账号 Cookie 无效 -> 本步骤失败 -> job 红叉
      # （python 层此时已主动发过 TG 详细告警）
      - name: Fail if cookie expired
        if: always()
        run: |
          if grep -qE "Cookie无效|Cookie失效|验证失败" data/logs/*$(date +%F).log 2>/dev/null; then
            echo "::error::检测到 Cookie 已失效！请在本地更新 config/setting.json 后重新上传 SETTING_JSON_B64 secret"
            exit 1
          fi

      # 兜底：上方任一环节失败（依赖安装、secret 缺失、python 崩溃等）时补发 TG 失败告警
      # Cookie 失效场景 python 层已发过详细通知，此处去重不重复推
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        run: |
          TG_BOT_TOKEN='${{ secrets.TG_BOT_TOKEN }}${{ secrets.TG_BOT_TOKEN_1 }}${{ secrets.TG_BOT_TOKEN_2 }}${{ secrets.TG_BOT_TOKEN_3 }}${{ secrets.TG_BOT_TOKEN_4 }}${{ secrets.TG_BOT_TOKEN_5 }}'
          TG_CHAT_ID='${{ secrets.TG_CHAT_ID }}'
          if grep -qE "Cookie无效|Cookie失效|验证失败" data/logs/*$(date +%F).log 2>/dev/null; then
            echo "Cookie 失效已在 python 层通知过，跳过重复通知"
            exit 0
          fi
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -fsS -m 20 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=melody-voter daily-sync 运行失败，详见 Actions 日志" \
              || echo "::warning::TG 失败通知发送失败（网络或凭据问题）"
          fi